<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品卡片</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;color:#272724;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:start}.card{overflow:hidden;border:1px solid #e7e5e0;border-radius:18px;background:#fff}.photo{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:#f7f6f2;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.photo small{padding:30px;color:#999}.switches{display:flex;gap:6px;position:absolute;bottom:10px;left:10px}.switches button{width:25px;height:25px;border:1px solid #d9d7d2;border-radius:50%;background:#fff;color:#555;cursor:pointer}.switches button[aria-pressed=true]{background:#353f3a;color:white;border-color:#353f3a}.content{padding:16px}h2{margin:0 0 8px;font-size:15px;font-weight:600;line-height:1.55}.spec{color:#5c655e;margin:0 0 12px}.price{font-size:22px;font-weight:600;letter-spacing:-.4px;margin:0}.source,.time,.image-note{font-size:12px;color:#898a83;margin:3px 0}.image-note{color:#92754d}.link{display:block;margin-top:15px;text-decoration:none;color:#3c5a47;font-weight:600}#empty{padding:22px;color:#888;font-size:13px}@media(prefers-color-scheme:dark){body{color:#e4e5df}.card{background:#222722;border-color:#3a413a}.photo{background:#191f1a}.spec{color:#b0b9ae}.source,.time{color:#9da697}.link{color:#b9d3bd}}@media(max-width:420px){#cards{grid-template-columns:1fr}}
</style>
<div id="cards"></div><div id="empty">等待商品信息…</div>
<script>
'use strict';
const root=document.getElementById('cards'),empty=document.getElementById('empty');
function inlineImage(asset){
 if(!asset||!['image/png','image/jpeg','image/webp'].includes(asset.mimeType)||typeof asset.data!=='string'||asset.data.length>3400000||!asset.data.length||asset.data.length%4!==0||!/^[A-Za-z0-9+/]+={0,2}$/.test(asset.data))return null;
 return 'data:'+asset.mimeType+';base64,'+asset.data;
}
function render(result){
 const data=result?.structuredContent,assets=result?._meta?.['cheng/imageAssets']||{};
 if(!Array.isArray(data?.cards))return;root.replaceChildren();empty.hidden=data.cards.length>0;
 for(const c of data.cards){
  if(!/^\d{5,24}$/.test(c.item_id))continue;
  const card=document.createElement('article');card.className='card';const photo=document.createElement('div');photo.className='photo';
  const imgs=(c.images||[]).map(x=>({...x,src:inlineImage(assets[c.item_id+':'+x.image_id])})).filter(x=>x.src);
  if(imgs.length){const img=document.createElement('img');img.src=imgs[0].src;img.alt=c.title||'商品图片';img.referrerPolicy='no-referrer';photo.append(img);if(imgs.length>1){const controls=document.createElement('div');controls.className='switches';imgs.forEach((entry,i)=>{const b=document.createElement('button');b.textContent=String(i+1);b.setAttribute('aria-label','查看第'+(i+1)+'张商品图');b.setAttribute('aria-pressed',i===0?'true':'false');b.onclick=()=>{img.src=entry.src;for(const other of controls.children)other.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed','true');};controls.append(b);});photo.append(controls);}}
  else{const text=document.createElement('small');text.textContent='暂未取得可展示的原图';photo.append(text);}
  const content=document.createElement('div');content.className='content';const h=document.createElement('h2');h.textContent=c.title||'商品';content.append(h);
  if(c.specs){const s=document.createElement('p');s.className='spec';s.textContent=Object.entries(c.specs).map(([k,v])=>k+'：'+v).join('；');content.append(s);}
  if(typeof c.price==='number'&&Number.isFinite(c.price)){const p=document.createElement('p');p.className='price';p.textContent='¥'+c.price.toFixed(2);content.append(p);}
  const source=document.createElement('p');source.className='source';source.textContent=(c.price_label||'价格未确认')+' · 最终金额未确认';content.append(source);
  if(c.image_note){const n=document.createElement('p');n.className='image-note';n.textContent=c.image_note;content.append(n);}
  if(c.fetched_at){const t=document.createElement('p');t.className='time';const d=new Date(c.fetched_at);t.textContent=(!Number.isNaN(d.valueOf())?d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}):'')+'读取'+(c.stale?' · 建议更新价格':'');content.append(t);}
  const a=document.createElement('a');a.className='link';a.textContent='查看商品 →';a.href='https://item.taobao.com/item.htm?id='+c.item_id+(c.sku_id&&/^\d{1,30}$/.test(c.sku_id)?'&skuId='+c.sku_id:'');a.target='_blank';a.rel='noopener noreferrer';content.append(a);card.append(photo,content);root.append(card);
 }
}
let seq=0;const pending=new Map();let parentOrigin='*';
function request(method,params){const id=++seq;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(Error('host timeout'))},8000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},parentOrigin);});}
window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data||e.data.jsonrpc!=='2.0')return;const m=e.data;if(e.origin&&e.origin!=='null')parentOrigin=e.origin;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(Error('host error')):p.resolve(m.result);return;}if(m.method==='ui/notifications/tool-result')render(m.params);});
function renderOpenAI(){
 const api=window.openai;if(!api?.toolOutput)return;
 const meta=api.toolResponseMetadata||{};
 const envelope=meta.call_tool_result||meta.mcp_tool_result;
 render({structuredContent:api.toolOutput,_meta:envelope?._meta||meta});
}
window.addEventListener('openai:set_globals',renderOpenAI);renderOpenAI();
if(window.parent!==window)request('ui/initialize',{appInfo:{name:'cheng-taobao-cards',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},parentOrigin)).catch(()=>{empty.textContent='请在聊天正文查看商品图片和链接。'});
</script></html>
